[package]
name = "bot"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.151"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Kernel"] }

[profile.release]
opt-level = 3
debug = false
codegen-units = 1
lto = "thin"
